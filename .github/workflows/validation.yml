name: ResearchMate validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-and-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip requests
      - run: python -m py_compile app.py research_engine.py outputs.py engine_mock_test.py smoke_test.py prompt_engine.py non_ai_exports.py prompt_engine_test.py non_ai_exports_test.py pages/*.py
      - run: python engine_mock_test.py
      - run: python prompt_engine_test.py

  output-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python smoke_test.py
      - run: python non_ai_exports_test.py
