name: ResearchMate validation

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

jobs:
  unit-and-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip requests
      - run: python -m py_compile app.py research_engine.py outputs.py engine_mock_test.py smoke_test.py llm_providers.py agent_orchestrator.py multi_agent_smoke_test.py
      - run: python engine_mock_test.py
      - run: python multi_agent_smoke_test.py

  output-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python smoke_test.py
