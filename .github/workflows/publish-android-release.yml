name: Publish ResearchMate Android Release

on:
  push:
    branches:
      - main
    paths:
      - "android/**"
      - ".github/workflows/publish-android-release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install required SDK packages
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Read app version
        id: app-version
        shell: bash
        run: |
          VERSION_NAME=$(sed -n 's/.*versionName="\([^"]*\)".*/\1/p' android/app/build.gradle.kts)
          if [ -z "$VERSION_NAME" ]; then
            echo "Could not read versionName from build.gradle.kts"
            exit 1
          fi
          echo "version=$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Assemble Android APK
        working-directory: android
        run: gradle assembleDebug --no-daemon -PAPI_BASE_URL=https://researchmate-ai.kavehjafari710.workers.dev

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.app-version.outputs.version }}
          name: ResearchMate AI ${{ steps.app-version.outputs.version }}
          body: |
            ResearchMate AI Android ${{ steps.app-version.outputs.version }}.

            ResearchMate AI 1.0 introduces the Scientific Document Studio.

            - A strict JSON package contract separates AI-authored content and scientific data from executable code. The app never runs code returned by an AI model.
            - Offline multi-page PDF composition supports structured sections, references, formatted tables, vector bar/line charts from supplied numeric data, and attached PNG/JPEG/WebP figures.
            - Package validation checks structure, chart-series lengths, table dimensions, required headings and missing figure/source metadata.
            - Image attachments are linked to figure IDs and read from local document URIs. Project, library and imported research data remain on-device.
            - A Persian guide explains each package section, how to request JSON from an AI model, attach figures, validate the package and inspect the resulting PDF.
            - DOCX export remains a basic editable text/Markdown handoff; embedded chart and image layout is not yet at PDF parity.

            No paid AI or publisher API is enabled. The renderer runs locally on Android. Verify source data, references, image permissions and final page layout before academic submission. The app does not verify scientific truth or publication readiness.

          draft: false
          prerelease: false
          make_latest: true
          files: android/app/build/outputs/apk/debug/app-debug.apk
