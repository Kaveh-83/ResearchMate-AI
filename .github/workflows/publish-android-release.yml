name: Publish ResearchMate Android Release

on:
  push:
    branches:
      - main
    paths:
      - "android/**"
      - ".github/workflows/publish-android-release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install required SDK packages
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Assemble release APK
        working-directory: android
        run: gradle assembleDebug --no-daemon -PAPI_BASE_URL=https://researchmate-ai.kavehjafari710.workers.dev

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.7.0
          name: ResearchMate AI 0.7.0
          body: |
            ResearchMate AI Android 0.7.0 — multi-provider scientific literature discovery.

            Includes multidisciplinary profile-aware search through OpenAlex, Crossref, Semantic Scholar, Europe PMC, PubMed and arXiv; advanced filters; DOI deduplication; separate open/restricted/unknown access categories; provider-level status; source-labelled citation counts; plus the existing local research library and writing workspace.

            This is a debug-signed APK. Uninstall an older build first if Android reports a signature conflict. Back up project data before uninstalling.
          draft: false
          prerelease: false
          make_latest: true
          files: android/app/build/outputs/apk/debug/app-debug.apk
