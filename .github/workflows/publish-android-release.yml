name: Publish ResearchMate Android Release

on:
  push:
    branches:
      - main
    paths:
      - "android/**"
      - ".github/workflows/publish-android-release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install required SDK packages
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Read app version
        id: app-version
        shell: bash
        run: |
          VERSION_NAME=$(sed -n 's/.*versionName="\([^"]*\)".*/\1/p' android/app/build.gradle.kts)
          if [ -z "$VERSION_NAME" ]; then
            echo "Could not read versionName from build.gradle.kts"
            exit 1
          fi
          echo "version=$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Assemble Android APK
        working-directory: android
        run: gradle assembleDebug --no-daemon -PAPI_BASE_URL=https://researchmate-ai.kavehjafari710.workers.dev

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.app-version.outputs.version }}
          name: ResearchMate AI ${{ steps.app-version.outputs.version }}
          body: |
            ResearchMate AI Android ${{ steps.app-version.outputs.version }}.

            Includes persistent saved academic searches with the full query profile, date range, provider selection, filters and sorting. Saved searches are stored locally on the device and can be loaded for reproducible reruns. Existing research projects, library records, notes and evidence remain intact.

            Search continues to use the configured free scholarly providers. No paid API integration is enabled by default.

            This is a debug-signed APK. Uninstall an older build first if Android reports a signature conflict. Back up project data before uninstalling.
          draft: false
          prerelease: false
          make_latest: true
          files: android/app/build/outputs/apk/debug/app-debug.apk
