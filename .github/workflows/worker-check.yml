name: Worker API validation

on:
  push:
    branches:
      - feature/android-native-platform
    paths:
      - "backend/edge-worker/**"
      - ".github/workflows/worker-check.yml"
  pull_request:
    paths:
      - "backend/edge-worker/**"
      - ".github/workflows/worker-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/edge-worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: TypeScript type check
        run: npx tsc --noEmit --target ES2022 --module ESNext --lib ES2022,DOM src/index.ts
      - name: Validate Wrangler configuration and bundle
        run: npx wrangler deploy --dry-run --outdir=./.wrangler-dry-run
